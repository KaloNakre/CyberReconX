<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <rect width="100%" height="100%" fill="#020617" />
  <g fill="#0ff" font-family="monospace" font-size="14">
    <text x="20" y="30">[ data → ]</text>
  </g>
  <rect x="20" y="60" width="760" height="12" rx="6" fill="#062c33" />
  <circle cx="40" cy="66" r="8" fill="#00ffd1">
    <animate attributeName="cx" from="40" to="760" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="20" y="150" font-family="Arial" font-size="12" fill="#9aa7b2">Motion-graphic placeholder (looping)</text>
</svg>
